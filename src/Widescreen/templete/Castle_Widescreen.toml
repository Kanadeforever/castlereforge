# 《幽城幻剑录》宽屏模组设置
# 本文件是标准 UTF-8 TOML，由同目录 Castle_Runtime.dll 的 TOML v1 服务统一读取。

[Display]
# 超宽屏模式：
# 0 = 16:9，输出 854×480（默认）；
# 1 = 21:9，输出 1120×480。
# 任何不是 0 或 1 的值都会安全回退到 0。
Ultrawide = 0

[Cinematic]
# 对话、消息和战斗时的左右侧区样式：
# 1 = 电影感模糊侧边栏（默认）；
# 0 = 纯黑侧边栏。
# 本项只改变侧区像素，不改变中央原版 640×480 的内容和坐标。
BlurredSides = 1

[Transition]
# 控制对话、菜单、战斗侧区推入和滑出动画的时间，单位毫秒。
# 有效范围 0～10000；0 = 立即切换，250 = 默认 0.25 秒。
EnterDurationMs = 250
ExitDurationMs = 250
