; 《幽城幻剑录》任务系统 ASI v0.1-dev6zc
; 文件编码：UTF-8 无 BOM；换行：CRLF。
;
; 当前运行时结构：
; 1) mods\asi 根目录只放 Castle_Quest.asi 与 Castle_Quest.ini；
; 2) 额外任务数据统一放入 mods\asi\Castle_Quest\；
; 3) 该目录固定为 manifest.toml + 25 份详细 Q*.toml + 25 份同名 Q*_addon.toml，共 51 个 TOML、0 个子目录；运行时不存在 routes.toml；
; 4) 详细 Q*.toml 保存原始游戏任务链；日常 Marker/文案修正和人工插入步骤优先写同名 _addon.toml；Ctrl+F8 统一事务式热重载；
; 5) 当前详细原始层为 25 Quest / 147 Stage（146 Canonical + 1 Guidance）/ 556 Stage-local Route；当前 addon 实际插入 1 步（阿吉 Event33）；
; 6) dev6zc 已彻底移除 [[warning]] 运行机制；失效风险若要做玩家提示，必须以后按真正可执行的 UI/任务机制重新设计；
; 7) addon 的 [[override]] 只覆盖明确填写的字段；[[insert]] 用 after+before 锚定原始相邻 Stage，指定 Scene/Event/世界坐标后即可插入人工体验步骤；
; 8) 人工插入步骤只观察指定 Event 是否真实开始执行，不写 GameVar、不阻止原版剧情；Ctrl+F8 会重置本进程内的人工步骤完成记录，便于重复测试；
; 9) 研究冻结层仍保留 1116 条全局条件化 Route，作为证据/恢复资料，但不会被 ASI 当作运行数据库读取；
; 10) 自动 TOUCH_EA 无论 Stage Route 还是同场景 Stage，都只有当前 RuntimeEntity 存在且 TouchBox=OK 才显示；没有 TouchBox 不退回实体 World；
; 11) 自动 MANUAL_EB/NPC 只有当前 RuntimeEntity 存在才显示，NPC 移动时 Marker 跟随；
; 12) 不存在 FrozenRouteWorld 自动离线回退；离线 world_x/world_y 只作研究/诊断证据；
; 13) 明确人工 manual_world 仍为最高优先级并允许独立存在；
; 14) 限时/易错过 Marker 使用固定像素模板沙漏，世界 Marker 与任务清单共用同一图标；
; 15) Longinus 当前有三段跨场景导航显式为 unresolved，等待后续实机/静态证据闭合，禁止猜造 Route。
;
; 注意：MarkerYOffset 只负责视觉偏移，不是世界地图坐标修复。
; 世界地图入口与普通地点同样遵守“当前真实原版事件”规则；禁止按单张截图写固定场景偏移。

[General]
Enable=1
WorldMarkers=1
QuestHud=1
; Ctrl+F6 可在本次游戏会话中单独隐藏/显示左侧常驻轻量任务区域，不影响 Ctrl+F7 完整任务清单。
; Ctrl+F7 可随时开关完整任务记录面板。这里设 0 表示启动时不占画面。
QuestPanelInitiallyOpen=0

; 快捷键总表：所有功能键都必须配合 Ctrl，单独按 F6~F11 不执行 Quest 功能。
; Ctrl+F6 = 隐藏/显示左侧常驻轻量任务区域。
; Ctrl+F7 = 打开/关闭完整任务记录面板。
; Ctrl+F8 = 热重载 INI 与 25 组 Base+Addon 任务数据库；成功时重置人工插入步骤的本进程完成记录。
; Ctrl+F9 = 隐藏/显示顶部诊断窗口。
; Ctrl+F10 = 隐藏/显示世界 Marker。
; Ctrl+F11 = 隐藏/显示场景对象调试框。

[Overlay]
; 1 = Lock/Unlock 软件像素后端。
; 0 = 完全不画 Quest Overlay，但任务读取/日志/热键仍运行，方便做 A/B 排查。
SoftwareBackend=1

[Visual]
; 中文文字只在独立内存 DIB 中用该字体栅格化，然后复制到锁定的 DirectDraw 像素。
; 不会对游戏 Surface 调 GetDC。
FontName=Microsoft JhengHei UI
FontSize=14
MarkerSize=14

; 任务 Tracker 固定在屏幕 9 点方向：贴左边缘并按总高度围绕 Y 轴中点展开。
; MaxWidth 是换行使用的最大像素宽度；实际还会受当前 Surface 一半宽度限制。
QuestHudMaxWidth=440
QuestHudMarginLeft=12

; 两种纵向间距都以“像素”为单位，可在游戏运行中按 Ctrl+F8 热重载。
; QuestItemSpacing：一个任务块结束后，到下一个任务标题之间的额外距离。
;   当前默认 0；需要更松散时可以自行填大。
; QuestObjectiveSpacing：同一个任务标题与第一行任务说明之间的额外距离。
;   旧版没有额外距离，因此默认 0。
; 两项有效范围 0~64；超出范围时插件会自动夹到 0~64。
QuestItemSpacing=0
QuestObjectiveSpacing=0

; player_notes（任务注释）使用青色显示。下面两项只调任务注释的纵向留白。
; QuestNoteSpacing：objective 正文结束到第一条任务注释之间的额外像素，默认 3，范围 0~64。
; QuestNoteLineSpacing：任务注释各行之间的额外像素，默认 2，范围 0~32。
; 两项都支持 Ctrl+F8 热重载。
QuestNoteSpacing=3
QuestNoteLineSpacing=2

; 实体 Marker 投影 A/B 开关：
;   WorldCamera      = runtime WorldX/Y - 原版 CameraX/Y（默认；随后经过宽屏 CameraPlan Surface 转换）
;   ControllerCamera = SF2 controller 根坐标 - 原版 Camera（旧算法，仅用于回退/对照）
; dev6e 起的世界地图 Route Exit 若成功读取 TouchBox，会优先使用原版 Section 0 触发矩形中心，
; 此时该 A/B 开关只作为并行诊断证据，不会覆盖 TouchBox 锚点。
; 如果填错字符串，插件会写日志并自动回退 WorldCamera。
EntityProjection=WorldCamera

; 只负责视觉上把 Marker 从锚点向上挪一点，避免正好盖住角色脚底/触发点。
; 不要用这里补偿某个特定地图的坐标误差。
MarkerYOffset=-34
MarkerOffsetX=0
MarkerOffsetY=0

[MarkerColor]
; Marker 与任务清单左侧图标的 RGB 配色。
; 格式固定为 R,G,B，三个值都必须是 0~255 的十进制整数。
; 可以直接从取色器、图片软件或网页复制常见 RGB 值；Ctrl+F8 热重载后立即生效。
; 这里只改变图标/Marker 的颜色，不改变任务名称文字已经验收的颜色。
; 主线：世界 Marker 使用菱形加感叹号；任务清单左侧继续使用五角星。
Main=255,205,70
; 普通不限时支线：世界 Marker 与任务清单都使用菱形加感叹号。
Side=80,220,220
; 限时或易错过支线：世界 Marker 与任务清单都使用固定像素模板沙漏。
Timed=255,150,60
; 同时限时且结局相关的支线：仍使用固定像素模板沙漏，但改为较柔和的暖红色。
EndingTimed=190,75,75

[Debug]
; dev6m：开发调试窗口独立开关；行为继承 dev6l 已验收实现。
; 1 = 启动时显示顶部诊断窗口，适合当前开发/实机取证。
; 0 = 启动时不显示；正式发行版只需把这里改为 0，不需要删除任何调试代码。
; Ctrl+F9 仍可在本次游戏会话中临时切换显示状态。
ShowDiagnosticWindow=1

; 默认关闭全场景对象调试框。场景对象来自 0x409580 探索管理器，而不是已经证伪的 0x89F7F0 五角色槽。
; 游戏中按 Ctrl+F11 可以临时打开。dev6w 会按对象密度自动使用两行紧凑标签或仅 E编号；
; 鼠标悬停实体/任务 Marker 时显示三行详细信息，并突出 WORLD、MouseWorld 与 A/O/F 坐标来源。
; F11 是纯开发功能，只支持鼠标聚焦，不设计手柄交互；原有 WorldCamera / ControllerCamera / TouchBox 日志证据继续保留。
ShowRuntimeEntities=0
ShowAllInteractiveEntities=0

; 1 = 比较每帧 5000 个 GameVar，并只在发生变化时写日志。
; <=16 项：完整逐项记录；17~64 项：前16项+摘要；>64 项：按“初始化/Bank切换候选”输出重点变量摘要。
; 全程只读，不 Hook EVE，不写 GameVar。
LogGameVarChanges=1

; 纯世界点仍保留作人工验证工具。正式任务 Marker 优先绑定真实 Event/Entity/触发区域，
; 不是把每个任务目标手写成固定坐标。
TestWorldMarker=0
WorldX=0
WorldY=0
