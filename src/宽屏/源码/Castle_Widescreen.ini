; 幽城幻剑录 宽屏模组 设置

[Display]
; 超宽屏：
;   0 = 16:9，854x480（默认）
;   1 = 21:9，1120x480
; 任何不是 0 或 1 的值都会回退到 0。
Ultrawide=0

[Cinematic]
; BlurredSides:
;   1 = 电影感的模糊侧边栏（默认）
;   0 = 纯黑侧边栏
; 此设置仅改变对话/消息画面和战斗所使用的侧边栏像素。
BlurredSides=1

[Transition]
; 控制对话、菜单、战斗的边框推入/滑出动画的时间
; 过渡值单位为毫秒，; 有效范围：0-10000
; 0 = 立即，250 = 默认（0.25秒）
EnterDurationMs=250
ExitDurationMs=250
