[FrameRate]
; 1 = 启用 FPSUnlock。
; 0 = ASI 仍加载，但不安装任何游戏 Hook。
Enable=1

; v1.3 当前正式实现固定为 60。
; 原版逻辑仍约 20Hz；普通地图从混合 Draw Queue 中只抽取 world 层额外绘制两张。
TargetFPS=60

; 1 = 每约10秒写一次统计，方便判断当前场景是否正在得到额外世界帧。
; 0 = 只写启动、保护和退出等关键日志。
LogStats=1

[Interpolation]
; 单个真实20Hz Tick允许拿来做速度预测的最大像素位移。
; 超过此值通常意味着传送、切图或剧情强制跳位，此时该轴不预测，直接使用真实位置。
; 合法范围 8..512，默认 96。
MaxPredictionStep=96
