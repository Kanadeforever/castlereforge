# 《幽城幻剑录》手柄支持 v0.4.0 默认配置
# 本文件是标准 UTF-8 TOML，由同目录 Castle_Runtime.dll 的 TOML v1 服务统一读取。
# 所有百分比和时间都会在程序内再次限制到安全范围，写错极端值不会直接越界。
# 下列开关统一使用 1 = 开启、0 = 关闭。

[Controls]
# 是否交换“确定/取消”语义：0 = Xbox 位置布局，1 = PlayStation 传统布局。
# 0：南键（Xbox A / PS X）确定，东键（Xbox B / PS O）取消。
# 1：东键（PS O / Xbox B）确定，南键（PS X / Xbox A）取消。
# 只交换确定/取消语义；RB+ABXY 战斗快捷键、X/Y 专属功能等物理位置操作不变。
# 鼠标模式中确定始终对应左键、取消始终对应右键，因此左右键也会跟随本选项交换。
SwapConfirmCancel = 0

[Mouse]
# 普通手柄状态是否默认隐藏鼠标；0 时交回原版和各界面自己的显隐逻辑。
DefaultHidden = 1

# 战斗目标选择时是否显示目标光标提示。
TargetSelectionCursor = 1

# Back/RT 鼠标模式下，左摇杆移动速度百分比。
MouseModeLeftStickSensitivityPercent = 100

# Back/RT 鼠标模式下，右摇杆精细移动速度百分比。
MouseModeRightStickSensitivityPercent = 15

[Investigation]
# 调查模式：
# 0 = 按住“确定键”，松开确定键进行交互，按住时按“取消键”取消；
# 1 = 按住 LT，再按“确定键”进行交互。
# 确定/取消的物理位置由 [Controls].SwapConfirmCancel 决定。
ActivationMode = 0

# 进入调查模式时是否自动聚焦离角色最近的可互动目标。
# 自动聚焦仍会经过原版 resolver 和 25 点探测确认，不会直接触发互动。
AutoFocusNearest = 1

# 调查模式右摇杆精细移动速度百分比。
RightStickSensitivityPercent = 15

# 右摇杆靠近可互动目标时的短距离吸附半径，单位为逻辑像素。
SnapRadiusPixels = 24

[Rumble]
# 所有插件震动事件共享的全局强度；0 = 完全关闭，100 = 默认全强度。
StrengthPercent = 100

# 显式调查或 Back/RT 鼠标模式中，指针首次碰到新互动目标的短震时长。
# 普通隐藏鼠标不会使用本项。
InvestigationHoverDurationMs = 80

# 真正激活普通手柄模式时的反馈时长；RT/LT 临时子态切换不使用本项。
ControllerModeDurationMs = 1000

[Movement]
# 普通地图左摇杆达到这个幅度百分比后进入跑步；低于阈值继续步行。
RunThresholdPercent = 85

[BattleNavigation]
# 0 = 每次采用原版初始选择；1 = 尝试记住上次已确认选择。
RememberSelection = 0

# 是否启用已经验收的战斗快捷键；关闭后仍保留普通战斗导航。
EnableShortcuts = 1

# 导航视觉至少保持的毫秒数，避免高速输入让原版焦点动画不可见。
VisualMinMs = 72

# 视觉确认需要连续命中的采样次数。
VisualHitCount = 2

# 等待原版菜单状态稳定的最长毫秒数。
SettleTimeoutMs = 240

# 按住方向键开始连发前的初始延时，以及连发后的重复间隔，单位毫秒。
RepeatInitialMs = 176
RepeatIntervalMs = 96
