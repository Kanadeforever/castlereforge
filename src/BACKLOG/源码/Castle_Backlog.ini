; Castle Backlog v0.2.0
; 所有键盘值都是 Win32 Virtual-Key（KB）码，可写十进制或 0x 开头的十六进制。
; 所有手柄值都是 SDL3 标准 Gamepad 按钮名；大小写、空格、-、_ 均不敏感。

[Backlog]
