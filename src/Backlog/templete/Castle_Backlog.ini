; Castle Backlog v0.3.4-test3
;
; 键盘键位使用 Win32 Virtual-Key 名称，但省略最前面的 VK_。
; 例如：B=VK_B，UP=VK_UP，RETURN=VK_RETURN，F5=VK_F5。
; 旧版十进制/0x 数字仍能读取，仅用于兼容旧 INI；建议以后都写名称。
;
; 鼠标操作是固定语义，不另外制造一套映射：
; - BACKLOG 未打开：滚轮向上可以打开历史。
; - BACKLOG 已打开：滚轮向上看更旧记录，滚轮向下看更新记录。
; - BACKLOG 已打开：鼠标右键退出。
;
; 本插件不再自行加载 SDL，也不会自己打开手柄。
; 单独安装时没有手柄支持；只有同时安装 Castle_PadSupport.asi 才会协作：
; - LB 打开；
; - LB 或 PadSupport 当前“取消”键退出；
; - 十字键浏览；
; - PadSupport 处于调查模式、RT 临时鼠标模式、Back 常驻鼠标模式时，BACKLOG 完全忽略手柄输入。

[Backlog]
Enabled=1
MaxEntries=128
PageSize=4

; 相邻历史对话框的纵向距离，单位是原版 640x480 UI 像素。
; 80~110 时同屏最多 4 条；111~160 时自动改成同屏最多 3 条。
; 默认 150，让完整原版大对话框有更自然的间距，同时保持最上姓名坐标安全。
PanelStrideY=150

; 长按方向键/十字键时，第一次自动重复前等待多久。
RepeatDelayMs=350

; 开始自动重复后，每隔多久再滚动一格。
RepeatIntervalMs=100

[Keyboard]
; 这里只写 Virtual-Key 名称，省略 VK_。
Open=B
Exit=B
Up=UP
Down=DOWN
Left=LEFT
Right=RIGHT
