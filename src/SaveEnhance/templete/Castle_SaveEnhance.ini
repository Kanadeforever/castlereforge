[Quick]
; 快速存档/快速读档总开关。
; 1 = 开启 F5/F9 以及可选 Controller 快捷组合；0 = 全部关闭。
; 这个开关不会关闭普通存档菜单的安全随时存档，也不会关闭 91~99 自动存档。
Enable=1

; 是否尝试连接 Castle_PadSupport.asi 的公开 API v1。
; 1 = 如果 Controller 插件存在，则额外启用 RB+R3 快速存档、RB+Start 快速读档请求。
; 0 = 只保留键盘 F5/F9。
; SaveEnhance 与 PadSupport 的加载先后顺序不限：如果启动时暂时找不到 API，会每秒低频重试。
ControllerEnable=1

; 快速读档需要连续多少次请求才真正读取 Save000.TSF。
; 允许 2 或 3；其它值会自动钳制到 2~3。
; 键盘 F9 与手柄 RB+Start 共用同一个确认计数，例如先按一次 F9，再按一次 RB+Start 也算两次。
QuickLoadPresses=2

; 连续快速读档确认的时间窗口，单位毫秒。
; 默认 1200；有效范围 300~3000。超时后前面的确认次数自动清零。
QuickLoadWindowMs=1200

[AutoSave]
; 自动存档总开关。
; 1 = 启用 91~99 的滚动自动档；0 = 不再自动写 91~99。
Enable=1

; 是否在“真正切换到另一张地图”后自动保存。
; 插件不会在地图对象刚变化的危险瞬间立刻写盘，而是等新地图连续稳定到安全锚点后再补存。
; 第一次看到地图（包括刚快速读档后）只建立基准，不会因此立即覆盖自动档。
SaveOnSceneChange=1

; 定时自动存档间隔，单位分钟。
; 0 = 关闭定时自动存档，但如果 SaveOnSceneChange=1，换地图自动档仍然工作。
; 1~1440 = 对应分钟数；更大的值自动按 1440 处理。
IntervalMinutes=5

[Sound]
; 所有声音都是“可选外置 WAV”，不会调用游戏原生音效。
; 每个字段只填写一个 WAV 文件名，例如 SaveOK.wav，不允许写绝对路径或子目录。
; 实际文件放在：
;   mods\asi\Castle_SaveEnhance\<这里填写的文件名>
; 留空、不以 .wav 结尾、文件不存在、winmm 不可用或播放失败时，都只是不发声，绝不影响存档/读档结果。
;
; SaveEnhance 自己的提示音音量，范围 0~100，默认 70。
; 0   = 完全静音；
; 1~99 = 在内存副本里缩放 PCM WAV 振幅，只影响 SaveEnhance，不改游戏/Windows 总音量；
; 100 = 不解析/改写 WAV，直接交给 Windows 原样播放，因此兼容 Windows 自己支持的其它 WAV 编码。
; 如果 Volume<100，请优先使用普通 PCM WAV（推荐 16-bit PCM）。不支持的压缩/float WAV 会静默禁用。
Volume=70

; F5 / RB+R3 快速存档成功后播放。
QuickSaveSuccess=

; 快速存档因为非自由行动、当前没有安全锚点或原版写盘失败时播放。
QuickSaveFailed=

; F9 / RB+Start 尚未达到最终确认次数时播放，可用于提示“还需再按一次”。
QuickLoadConfirm=

; 快速读取 Save000.TSF 成功后播放。
QuickLoadSuccess=

; 快速读档处于非法状态、Save000.TSF 不存在或原版 LoadSlot 失败时播放。
QuickLoadFailed=

; 91~99 自动存档成功后播放。若不希望后台自动保存打扰，保持空白即可。
AutoSaveSuccess=

; 91~99 真正尝试写盘但失败后播放。只是暂时没有安全锚点时不会把它当成一次失败提示。
AutoSaveFailed=
