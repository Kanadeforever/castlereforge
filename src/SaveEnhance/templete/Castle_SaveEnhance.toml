# Castle_SaveEnhance v0.3.0-test4
# 本文件是标准 UTF-8 TOML，由同目录 Castle_Runtime.dll 的 TOML v1 服务统一读取。

[Quick]
# 快速存档/快速读档总开关。
# 1 = 开启 F5/F9 以及可选手柄快捷组合；0 = 全部关闭。
# 本项不会关闭普通存档菜单的安全随时存档，也不会关闭 91～99 自动存档。
Enable = 1

# 是否读取 Runtime Input 服务发布的手柄动作。
# 1 = Castle_PadSupport 存在时启用 RB+R3 快速存档、RB+Start 快速读档；
# 0 = 只保留键盘 F5/F9。
# 插件之间不再按 ASI 文件名直连；加载顺序由 Runtime 统一协调。
ControllerEnable = 1

# 快速读档需要连续多少次请求才真正读取 Save000.TSF。
# 允许 2 或 3，其它值会夹到 2～3。键盘和手柄请求共用同一个确认计数。
QuickLoadPresses = 2

# 连续快速读档确认的时间窗口，单位毫秒。
# 默认 1200，有效范围 300～3000；超时后前面的确认次数自动清零。
QuickLoadWindowMs = 1200

[AutoSave]
# 自动存档总开关。1 = 启用 91～99 滚动自动档；0 = 不再自动写这些槽。
Enable = 1

# 是否在真正切换到另一张地图后自动保存。
# 插件不会在地图对象刚变化的危险瞬间写盘，而会等新地图稳定到安全锚点后补存。
# 第一次看到地图（包括刚快速读档后）只建立基准，不会立即覆盖自动档。
# 由于本作支线条件容易被过早自动档覆盖，本项默认关闭。
SaveOnSceneChange = 0

# 定时自动存档间隔，单位分钟。
# 0 = 关闭定时自动存档，但 SaveOnSceneChange=1 时换图自动档仍然工作；
# 1～1440 = 对应分钟数，更大的值按 1440 处理。默认 5 分钟。
IntervalMinutes = 5

[Visual]
# 原版书卷翻页 + 原版Font24文字。1开启，0仅关闭提示，不改变存档安全规则。
Notification = 1
# 1放右下角，0放右上角；位置根据Runtime Display当帧几何计算。
BottomRight = 1
# 在原槽号左侧标出两字“自动”“快速”，普通槽不额外标“手动”。
SlotLabels = 1
# 槽位“自动/快速/新”的笔画加粗量，重启游戏后生效，不影响已验收的书卷提示文字。
# 有效范围0～200，每1等于额外0.01个游戏逻辑像素，超出范围自动夹紧。
# 0 = 不额外加粗；25 = 0.25像素；50 = 半像素；100 = test3的额外1像素；200 = 额外2像素。
# 小数部分通过边缘与背景颜色混合实现，16位色会有量化；不需要只能整像素/三挡切换。
SlotTextWeight = 0
# 槽位新增文字相对原槽号的垂直偏移，单位为游戏逻辑像素；负数上移，正数下移。
# 默认-2，范围-12～12；“新”和“自动/快速”共用基线，不改变原版槽号坐标。
SlotTextOffsetY = -2
# 手动与自动分别保留一个红色“新”；快速槽不参与。读取/浏览不清除。
LatestMark = 1
# 1让红字缓慢明暗变化，0保持亮红；不增加线程或独立计时器。
NewPulse = 1

[Sound]
# 所有提示音都是可选外置 WAV，不调用游戏原生音效。
# 每项只允许填写一个 WAV 文件名，不允许绝对路径、斜杠或子目录。
# 实际文件位置：mods\asi\Castle_SaveEnhance\<这里填写的文件名>
# 留空、扩展名错误、文件不存在、winmm 不可用或播放失败时都只是不发声，绝不影响存读档。
#
# SaveEnhance 自己的提示音音量，范围 0～100，默认 50。
# 0 = 完全静音；1～99 = 在内存副本中缩放 PCM WAV 振幅；
# 100 = 不改写 WAV，直接交给 Windows 播放，可兼容系统支持的其它 WAV 编码。
# Volume<100 时请优先使用普通 16-bit PCM WAV；不支持的压缩/float WAV 会静默禁用。
Volume = 50

# F5 / RB+R3 快速存档成功后播放。
QuickSaveSuccess = ""

# 快速存档因状态不安全、没有安全锚点或原版写盘失败时播放。
QuickSaveFailed = ""

# F9 / RB+Start 尚未达到最终确认次数时播放。
QuickLoadConfirm = ""

# 快速读取 Save000.TSF 成功后播放。
QuickLoadSuccess = ""

# 快速读档状态非法、Save000.TSF 不存在或原版 LoadSlot 失败时播放。
QuickLoadFailed = ""

# 91～99 自动存档成功后播放；不希望后台保存打扰时保持空字符串。
AutoSaveSuccess = ""

# 91～99 真正尝试写盘但失败后播放；暂时没有安全锚点不算一次失败。
AutoSaveFailed = ""
